points:
  - ar: أنسّق بين المونتاج والتصميم في محتوى المنصات الاجتماعية (لينكدإن أولًا)، والحملات البريدية، وقنوات يوتيوب، والبث المباشر، وورش العمل، والترويج لها.
    en: Coordinate editors and designers on content for social platforms (LinkedIn first), email campaigns, YouTube channels, live streams and workshops, including their promotion.
  - ar: حوّلت تقرير الأداء الأسبوعي إلى لوحة متابعة تحدّث نفسها. كان تجهيز الأرقام يستغرق نحو ساعة كل أسبوع، والآن لا يحتاج أي عمل يدوي.
    en: Turned the weekly performance report into a dashboard that updates itself. Preparing the numbers used to take about an hour each week and now needs no manual work.
  - ar: أتمتُّ رفع الفيديوهات من Google Drive إلى يوتيوب، وكان رفع الفيديو الواحد يدويًا يستغرق نحو ساعة.
    en: Automated video uploads from Google Drive to YouTube. Each upload took about an hour by hand.
  - ar: أعددت تقارير أداء مجدولة تحدّث سجل الأداء التاريخي للمنصات.
    en: Set up scheduled performance reports that update the platforms' historical performance sheet.
