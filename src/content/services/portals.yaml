order: 1
title:
  ar: أنظمة وبوابات الإدارة
  en: Management systems and portals
text:
  ar: بوابة ويب لفريقك فيها الأدوار والصلاحيات، والسجلات، وسير العمل، والمدفوعات، والتقارير، بالعربية والإنجليزية.
  en: A web portal for your team, with roles and permissions, records, workflows, payments and reports, in Arabic and English.
